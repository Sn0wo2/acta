name: Rust Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1)"
        required: true
        type: string
      snapshot:
        description: "Snapshot mode (no bump, no tag, no publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.snapshot == true && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit,cargo-deny,cargo-audit

      - name: Normalize version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          VERSION=${RELEASE_VERSION#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: ${{ github.event_name == 'push' || !inputs.snapshot }}
        run: cargo set-version --workspace "$VERSION"

      - name: Commit version bump
        if: ${{ github.event_name == 'push' || !inputs.snapshot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(release): bump version to $VERSION"

      - name: Run gated checks
        run: make ci

      - name: Push version commit and tag
        if: ${{ github.event_name == 'push' || !inputs.snapshot }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_SHA=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
            if [[ -z "$TAG_SHA" ]]; then
              echo "Could not find remote tag $GITHUB_REF" >&2
              exit 1
            fi
            git tag -f "v$VERSION"
            git push --atomic --force-with-lease="$GITHUB_REF:$TAG_SHA" origin \
              "HEAD:$DEFAULT_BRANCH" "HEAD:$GITHUB_REF"
          else
            git tag "v$VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH" --tags
          fi

      - name: Record release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build artifacts
    permissions:
      contents: read
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      snapshot: ${{ inputs.snapshot == true }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    if: "!inputs.snapshot"
    needs: [prepare, build]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ github.event.repository.name }}-*-builds
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archives found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --verify-tag --generate-notes --title "v$VERSION" "${flags[@]}"
          fi

      - name: Publish to crates.io
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --allow-dirty
