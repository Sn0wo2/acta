name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
      version:
        type: string
      snapshot:
        type: boolean
        default: true

permissions: {}

env:
  GORELEASER_CURRENT_TAG: ${{ inputs.version && format('v{0}', inputs.version) }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-windows
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
            artifacts: |
              dist/*.tar.gz
              dist/*.zip
          - platform: macos
            os: macos-latest
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            artifacts: |
              dist/*_darwin_*.tar.gz
              dist/*_macos.tar.gz
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
          components: rust-src

      - uses: taiki-e/install-action@v2
        if: ${{ !inputs.snapshot }}
        with:
          tool: cargo-edit

      - name: Sync workspace version
        if: ${{ !inputs.snapshot }}
        run: cargo set-version --workspace "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.platform }}${{ inputs.snapshot && '-snapshot' || '' }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install mingw-w64
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - uses: mlugg/setup-zig@v2

      - name: Ensure build script is executable
        run: chmod +x scripts/cargo-or-zigbuild.js

      - name: Build snapshot archives with debug-grade optimization
        if: ${{ inputs.snapshot }}
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=0"
            echo "CARGO_PROFILE_RELEASE_LTO=false"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
          } >> "$GITHUB_ENV"

      - name: Build and package archives
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean ${{ inputs.snapshot && '--snapshot' || '--skip=publish,validate' }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.platform }}-builds
          path: ${{ matrix.artifacts }}
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.snapshot && 7 || 30 }}
