name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install rust-src
        shell: bash
        run: rustup component add rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: acta-cargo
          cache-on-failure: true

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
      - name: Install macOS SDK
        run: python3 scripts/install-macos-sdk.py

      - name: Cache cargo-zigbuild
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: ${{ runner.os }}-cargo-tool-zigbuild-v1

      - name: Install cargo-zigbuild
        run: python3 scripts/ensure-tool.py cargo-zigbuild -- pip3 install cargo-zigbuild
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Prepare scripts
        run: chmod +x ./scripts/cargo-or-zigbuild.py

      - name: Build
        run: make build
        env:
          SDKROOT: /opt/MacOSX11.3.sdk

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: acta-builds
          path: dist/*
          retention-days: 7
