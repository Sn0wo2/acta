name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          [fmt-check, clippy, doc, check, check-all-features, check-no-default]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true
      - run: make ${{ matrix.target }}

  dependencies:
    name: Dependencies (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [deny, audit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-${{ matrix.tool }}
      - run: make ${{ matrix.tool }}

  geiger:
    name: Cargo Geiger
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-geiger
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - run: cargo +nightly geiger --all-features --output-format GitHubMarkdown > geiger-report.md 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: geiger-report-${{ github.sha }}
          path: geiger-report.md
          retention-days: 30
      - run: cat geiger-report.md >> "$GITHUB_STEP_SUMMARY"

  semver:
    name: Semver Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks check-release --all-features
