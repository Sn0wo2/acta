[package]
name = "acta-ffi"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
acta = { path = "../..", version = "0.6.0", default-features = false, features = ["serde", "file", "compress", "native-async"] }
serde_json = "1"
tracing = "0.1"
