[package]
name = "acta-ffi"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "C foreign function interface for acta"
repository = "https://github.com/Sn0wo2/acta"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
cbindgen = "0.29"

[dependencies]
acta = { path = "../..", version = "0.6.0", default-features = false, features = ["serde", "file", "compress", "native-async"] }
acta-abi = { workspace = true }
