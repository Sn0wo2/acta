[package]
name = "acta-wasm"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
acta = { path = "../..", version = "0.6.0", default-features = false, features = ["serde", "wasm-console"] }
serde_json = "1"
tracing = "0.1"
wasm-bindgen = "0.2"
