[package]
name = "acta-wasm"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "WebAssembly bindings for acta"
repository = "https://github.com/Sn0wo2/acta"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
acta = { workspace = true, features = ["serde", "wasm-console", "nerd"] }
acta-abi = { workspace = true }
wasm-bindgen = "0.2"
